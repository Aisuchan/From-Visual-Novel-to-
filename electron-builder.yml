appId: com.aisuchan.fromvisualnovelto
productName: From Visual Novel to
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - "**/*.node"
win:
  target:
    - target: nsis
      arch:
        - x64
  # Hyphenated on purpose: the installer file must match the name electron-builder
  # writes into latest.yml (spaces there become hyphens), or a manually uploaded
  # release breaks auto-update — GitHub also turns spaces in an asset name into
  # dots. The display name stays "From Visual Novel to" (productName above).
  artifactName: From-Visual-Novel-to-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
publish:
  provider: github
  owner: Aisuchan
  repo: From-Visual-Novel-to-
